name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Préparer la clé de signature (optionnelle)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "APK signé avec votre clé personnelle."
          else
            echo "::warning::Secret KEYSTORE_BASE64 absent : APK signé avec une clé de debug temporaire (mises à jour impossibles sans désinstaller)."
          fi

      - name: Compiler l'APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/muscu-${GITHUB_RUN_NUMBER}.apk"

      - name: Publier l'APK (artefact)
        uses: actions/upload-artifact@v6
        with:
          name: muscu-apk
          path: dist/*.apk
          retention-days: 30

      - name: Envoyer l'APK sur Telegram
        # Les secrets ne sont volontairement jamais transmis aux pull requests.
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Secrets Telegram absents : l'APK reste disponible dans les artefacts GitHub."
            exit 0
          fi

          apk_file=$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk_file"

          curl --fail --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "document=@${apk_file}" \
            --form "caption=Muscu APK — build #${GITHUB_RUN_NUMBER}"

      - name: Créer une Release GitHub (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
